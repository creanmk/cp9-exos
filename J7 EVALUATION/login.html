<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DropRushSplit (DR$) — connexion · recette CP9 J7 · réservation de places et split de note." />
  <title>DR$ — Connexion</title>
  <link rel="icon" href="./assets/drs-logo.png" type="image/png" />
  <link rel="stylesheet" href="./css/drs.css" />
</head>
<body>
  <main class="wrap">
    <div id="header"></div>

    <div class="auth-panel">
      <article class="auth-card">
        <img class="auth-logo" src="./assets/drs-logo.png" alt="" width="72" height="32" />
        <span class="tag" style="display:table;margin:0 auto 0.5rem">Auth · US-05</span>
        <h1>Connexion</h1>
        <p class="intro">Accédez aux drops et consultez votre split.</p>

        <div id="login-error" class="alert alert-error hidden" role="alert" aria-live="polite"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.fr" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>

        <div class="demo-accounts">
          <p class="demo-accounts-label">Comptes démo — remplissage rapide</p>
          <div class="demo-accounts-actions">
            <button type="button" class="btn btn-demo" data-demo-email="test@drs.fr" data-demo-password="Test1234!">Participant</button>
            <button type="button" class="btn btn-demo" data-demo-email="orga@drs.fr" data-demo-password="Orga1234!">Organisateur</button>
            <button type="button" class="btn btn-demo" data-demo-email="obs@drs.fr" data-demo-password="Obs1234!">Observateur</button>
          </div>
        </div>
      </article>
    </div>

    <div id="footer"></div>
  </main>

  <script src="./js/store.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
