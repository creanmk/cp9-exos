<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DR$ — Connexion</title>
  <link rel="stylesheet" href="./css/drs.css" />
</head>
<body>
  <main class="wrap">
    <div id="header"></div>

    <div class="auth-panel">
      <article class="auth-card">
        <span class="tag" style="display:table;margin:0 auto 0.5rem">Auth · US-05</span>
        <h1>Connexion</h1>
        <p class="intro">Accédez aux drops et consultez votre split.</p>

        <div id="login-error" class="alert alert-error hidden"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.fr" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
      </article>

      <div class="hint-box">
        Participant <code>test@drs.fr</code> · Organisateur <code>orga@drs.fr</code><br/>
        Mot de passe <code>Test1234!</code> / <code>Orga1234!</code>
      </div>
    </div>

    <div id="footer"></div>
  </main>

  <script src="./js/store.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
